name: Test ChandBazaar plugin
on:
  push:
    paths:
      - ".build/**"
      - ".github/workflows/test-chandbazar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, dom, fileinfo, gd, intl, mbstring, mysqli, soap, zip, openssl
          coverage: none

      - name: Reconstruct plugin source archive
        run: |
          set -euo pipefail
          cat .build/chandbazar-dev-plugin.tar.xz.b64 .build/chandbazar-dev-plugin.tar.xz.part1.b64 | base64 -d > /tmp/chandbazar-dev-plugin.tar.xz
          xz -t /tmp/chandbazar-dev-plugin.tar.xz
          mkdir -p /tmp/plugin-src
          tar -xJf /tmp/chandbazar-dev-plugin.tar.xz -C /tmp/plugin-src
          test -f /tmp/plugin-src/chandbazar/chandbazar.php

      - name: PHP syntax checks
        run: find /tmp/plugin-src/chandbazar -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Unit checks
        run: php /tmp/plugin-src/chandbazar/tests/unit/run.php

      - name: Download pinned WordPress, WooCommerce and WP-CLI
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp
          curl --fail --location --retry 4 https://wordpress.org/wordpress-7.1.3.zip -o /tmp/wordpress.zip
          unzip -q /tmp/wordpress.zip -d /tmp/wp
          curl --fail --location --retry 4 https://downloads.wordpress.org/plugin/woocommerce.11.2.1.zip -o /tmp/woocommerce.zip
          unzip -q /tmp/woocommerce.zip -d /tmp/wp/wordpress/wp-content/plugins
          curl --fail --location --retry 4 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Install WordPress, activate WooCommerce and ChandBazaar
        env:
          MYSQL_PWD: wp
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do mariadb -h127.0.0.1 -uwp wordpress -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 2; done
          mariadb -h127.0.0.1 -uwp wordpress -e 'SELECT 1'
          php /tmp/wp-cli.phar config create --path=/tmp/wp/wordpress --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1 --skip-check
          php /tmp/wp-cli.phar core install --path=/tmp/wp/wordpress --url=http://127.0.0.1:8080 --title=ChandBazaar-CI --admin_user=ci_admin --admin_password="$(openssl rand -hex 20)" --admin_email=ci@example.invalid --skip-email
          cp -a /tmp/plugin-src/chandbazar /tmp/wp/wordpress/wp-content/plugins/chandbazar
          php /tmp/wp-cli.phar plugin activate woocommerce --path=/tmp/wp/wordpress
          php /tmp/wp-cli.phar plugin activate chandbazar --path=/tmp/wp/wordpress
          php /tmp/wp-cli.phar cbz status --path=/tmp/wp/wordpress
          php /tmp/wp-cli.phar eval 'global $wpdb; foreach (array("accounts","product_map","order_map","operations","logs") as $t) { $n=$wpdb->prefix."chandbazar_".$t; if ($wpdb->get_var($wpdb->prepare("SHOW TABLES LIKE %s",$n)) !== $n) { WP_CLI::error("Missing table: ".$n); } } WP_CLI::success("All ChandBazaar tables exist.");' --path=/tmp/wp/wordpress
          cat > /tmp/chandbazar-queue-test.php <<'PHP'
          <?php
          global $wpdb;
          $table = $wpdb->prefix . 'chandbazar_operations';
          $workerA = str_repeat('a', 32);
          $workerB = str_repeat('b', 32);
          $workerC = str_repeat('c', 32);
          $key = \\CBZ\\Sync\\Operations::enqueue(777, 'ci_stock', 888, array('qty' => 5));
          $row = $wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE account_id=%d AND operation_key=%s", 777, $key), ARRAY_A);
          if (!$row || $row['status'] !== 'pending') { WP_CLI::error('Queue enqueue did not create pending operation.'); }
          $claimA = \\CBZ\\Sync\\Operations::claimNext($workerA, 30);
          if (!$claimA || $claimA['claimed_by'] !== $workerA) { WP_CLI::error('Worker A failed to claim operation.'); }
          if (!\\CBZ\\Sync\\Operations::finish($claimA['id'], $workerA, (int)$claimA['claim_generation'], 'done')) { WP_CLI::error('Worker A could not finish its own claim.'); }
          \\CBZ\\Sync\\Operations::enqueue(777, 'ci_stock', 888, array('qty' => 6));
          $row = $wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE id=%d", $claimA['id']), ARRAY_A);
          if (!$row || $row['status'] !== 'pending') { WP_CLI::error('A completed operation was not re-queued on a later change.'); }
          $claimA2 = \\CBZ\\Sync\\Operations::claimNext($workerA, 30);
          if (!$claimA2) { WP_CLI::error('Worker A could not reclaim re-queued operation.'); }
          $wpdb->update($table, array('lease_until' => '2000-01-01 00:00:00'), array('id' => (int)$claimA2['id']));
          $claimB = \\CBZ\\Sync\\Operations::claimNext($workerB, 30);
          if (!$claimB || (int)$claimB['claim_generation'] <= (int)$claimA2['claim_generation']) { WP_CLI::error('Worker B did not receive a newer fencing generation.'); }
          if (\\CBZ\\Sync\\Operations::finish($claimA2['id'], $workerA, (int)$claimA2['claim_generation'], 'done')) { WP_CLI::error('Stale worker A incorrectly finished worker B claim.'); }
          if (!\\CBZ\\Sync\\Operations::finish($claimB['id'], $workerB, (int)$claimB['claim_generation'], 'done')) { WP_CLI::error('Current worker B could not finish its claim.'); }
          \\CBZ\\Sync\\Operations::enqueue(777, 'ci_stock', 888, array('qty' => 6));
          $claimC = \\CBZ\\Sync\\Operations::claimNext($workerC, 30);
          if (!$claimC) { WP_CLI::error('Completed operation was not re-queued for dirty test.'); }
          \\CBZ\\Sync\\Operations::enqueue(777, 'ci_stock', 888, array('qty' => 7));
          $row = $wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE id=%d", $claimC['id']), ARRAY_A);
          if (!$row || (int)$row['dirty'] !== 1) { WP_CLI::error('Change during claim did not set dirty.'); }
          if (!\\CBZ\\Sync\\Operations::finish($claimC['id'], $workerC, (int)$claimC['claim_generation'], 'done')) { WP_CLI::error('Worker C could not finish dirty operation.'); }
          $row = $wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE id=%d", $claimC['id']), ARRAY_A);
          if (!$row || $row['status'] !== 'pending' || (int)$row['dirty'] !== 0) { WP_CLI::error('Dirty completion did not schedule a fresh pending pass.'); }
          WP_CLI::success('Queue idempotency, re-queue, dirty flag and stale-worker fencing passed.');
          PHP
          php /tmp/wp-cli.phar eval-file /tmp/chandbazar-queue-test.php --path=/tmp/wp/wordpress

      - name: WordPress HTTP smoke test
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t /tmp/wp/wordpress >/tmp/chandbazar-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            CODE="$(curl -sS -o /tmp/chandbazar-home.html -w '%{http_code}' http://127.0.0.1:8080/ || true)"
            [ "$CODE" = "200" ] && break
            sleep 1
          done
          if [ "$CODE" != "200" ]; then cat /tmp/chandbazar-http.log; exit 1; fi
          echo "WordPress returned HTTP $CODE"
